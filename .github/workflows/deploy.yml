name: Publicar site
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bundle_url:
        description: Link do pacote do site
        required: false
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar arquivos do site
        run: |
          mkdir -p _site
          curl -fsSL "$BUNDLE_URL" -o site.tar.gz
          tar xzf site.tar.gz -C _site
          touch _site/.nojekyll
          ls -la _site
        env:
          BUNDLE_URL: ${{ inputs.bundle_url || 'https://d2ol7oe51mr4n9.cloudfront.net/user_3JTK0Ep2oaqQPNlFU5MwyiqdaXV/8368e4e2-018e-4bfc-bac3-5e2e9b3bf691.gz' }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
